<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup check (sample)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f8; color: #1c1c1c; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #555; font-size: 14px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }
  button { padding: 6px 12px; font-size: 14px; margin-right: 8px; }
  .tot { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .box { flex: 1; min-width: 150px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fff; }
  .box b { font-size: 22px; display: block; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
  .name { font-weight: 700; font-size: 16px; }
  .chip { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; border: 1px solid #ccc; }
  .ok { background: #e8f5e9; border-color: #a5d6a7; }
  .warn { background: #fff4e5; border-color: #f0c27b; }
  .bad { background: #fdecea; border-color: #e5a29b; }
  ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  li.bad::marker { color: #b3261e; } li.warn::marker { color: #e08a00; }
  .msg { background: #fff4e5; border: 1px solid #f0c27b; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin: 8px 0; }
  .err { background: #fdecea; border-color: #e5a29b; }
  .foot { font-size: 12px; color: #666; }
</style>
</head>
<body>
<main>
  <h1>Backup check (sample)</h1>
  <div class="sub">For each project: how much data could you lose in the worst case, and what is missing? You fill in the facts; the page does not connect to any project.</div>
  <div id="banner"></div>
  <section class="card">
    <textarea id="input" placeholder='{"projects":[ ... ]}' spellcheck="false"></textarea>
    <div style="margin-top:8px"><button id="load-sample">Load sample projects</button><button id="clear">Clear</button></div>
    <div id="msg"></div>
  </section>
  <div id="board"></div>
  <div class="foot" id="foot"></div>
</main>
<script src="check.js"></script>
<script src="app.js"></script>
</body>
</html>
